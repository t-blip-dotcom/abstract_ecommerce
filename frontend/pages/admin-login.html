<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login — Abstract Cosmetics</title>

  <script src="../js/theme-init.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/buttons.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/toast.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <header class="header">
    <div class="container">
      <a class="header-logo-container" href="index.html" aria-label="Abstract Cosmetics — go to home">
        <img class="header-logo" src="../assets/abstract_logo.png" alt="Abstract Cosmetics logo">
        <span class="header-greeting">Abstract Cosmetics</span>
      </a>
      <div class="header-actions">
        <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle color theme">
          <i data-lucide="sun-moon" class="theme-icon theme-icon-auto"></i>
          <i data-lucide="sun" class="theme-icon theme-icon-light"></i>
          <i data-lucide="moon" class="theme-icon theme-icon-dark"></i>
          <span class="theme-toggle-label">Auto</span>
        </button>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-card-brand">
        <img class="header-logo" src="../assets/abstract_logo.png" alt="Abstract Cosmetics logo">
        <h2>Staff sign in</h2>
        <p class="auth-card-subtitle">For approved shop admins, managers, and staff.</p>
      </div>

      <div class="auth-tabs">
        <button class="is-active" data-auth-tab="login">Log in</button>
        <button data-auth-tab="request">Request staff access</button>
      </div>

      <form id="staff-login-form" novalidate class="auth-form is-active" data-auth-form="login">
        <div class="field">
          <label for="staff-username">Username</label>
          <input type="text" id="staff-username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="staff-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="staff-password" name="password" autocomplete="current-password" required>
            <button type="button" class="password-toggle" aria-label="Toggle password visibility">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn--primary btn--full">Log in</button>
      </form>

      <form id="staff-request-form" novalidate class="auth-form" data-auth-form="request">
        <div class="field">
          <label for="request-name">Full name</label>
          <input type="text" id="request-name" name="name" required>
        </div>
        <div class="field">
          <label for="request-username">Choose a username</label>
          <input type="text" id="request-username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="request-password">Choose a password</label>
          <div class="password-wrap">
            <input type="password" id="request-password" name="password" autocomplete="new-password" required>
            <button type="button" class="password-toggle" aria-label="Toggle password visibility">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="request-password-confirm">Confirm password</label>
          <div class="password-wrap">
            <input type="password" id="request-password-confirm" autocomplete="new-password" required>
            <button type="button" class="password-toggle" aria-label="Toggle password visibility">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>
        <p class="auth-card-hint">
          You'll be able to log in once an admin reviews and approves your account
        </p>
        <button type="submit" class="btn btn--primary btn--full">Submit request</button>
      </form>

      <p class="auth-card-footer-link">Not staff? <a href="login.html">Customer log in</a></p>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/forms.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/theme-init.js"></script>
  <script src="../js/admin-login.js"></script>
</body>
</html>
