<!DOCTYPE html>
<html lang="en">

<head>
  <script src="../js/theme-init.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff — Abstract Cosmetics Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/buttons.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/modal.css">
  <link rel="stylesheet" href="../css/toast.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-topbar">
        <div class="admin-sidebar-brand">
          <i data-lucide="sparkles"></i> Abstract Admin
        </div>
        <button class="admin-sidebar-toggle" id="admin-sidebar-toggle" type="button" aria-label="Toggle menu">
          <i data-lucide="menu"></i>
        </button>
      </div>
      <div class="admin-sidebar-panel" id="admin-sidebar-panel">
        <p class="admin-sidebar-role" id="admin-role-label"></p>
        <nav class="admin-nav" id="admin-nav"></nav>
        <a class="admin-sidebar-logout" href="index.html" target="_blank" rel="noopener">
          <i data-lucide="store"></i> View store
        </a>
        <button class="admin-sidebar-logout" id="admin-logout" type="button">
          <i data-lucide="log-out"></i> Log out
        </button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1>Staff</h1>
          <p>Approve new sign-ups and manage roles. Staff create their own accounts on the login page.</p>
        </div>
      </div>

      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th class="hide-on-mobile">Username</th>
              <th>Role</th>
              <th>Status</th>
              <th class="hide-on-mobile">Last login</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="admin-staff-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="staff-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="staff-modal-title">Edit staff member</h3>
        <button class="modal-close" id="staff-modal-close" type="button">Cancel</button>
      </div>
      <form id="staff-form" novalidate>
        <div class="field">
          <label for="staff-name">Full name</label>
          <input type="text" id="staff-name" required>
        </div>
        <div class="field">
          <label for="staff-username">Username</label>
          <input type="text" id="staff-username" disabled>
        </div>
        <div class="field">
          <label for="staff-role">Role</label>
          <select id="staff-role" required></select>
        </div>
        <div class="field">
          <label for="staff-status">Status</label>
          <select id="staff-status" required>
            <option value="pending">Pending approval</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
        <button type="submit" class="btn btn--primary btn--full" id="staff-form-submit">Save changes</button>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/forms.js"></script>
  <script src="../js/admin-shared.js"></script>
  <script src="../js/admin-staff.js"></script>
</body>

</html>
