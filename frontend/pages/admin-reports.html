<!DOCTYPE html>
<html lang="en">

<head>
  <script src="../js/theme-init.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — Abstract Cosmetics Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/buttons.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-topbar">
        <div class="admin-sidebar-brand">
          <i data-lucide="sparkles"></i> Abstract Admin
        </div>
        <button class="admin-sidebar-toggle" id="admin-sidebar-toggle" type="button" aria-label="Toggle menu">
          <i data-lucide="menu"></i>
        </button>
      </div>
      <div class="admin-sidebar-panel" id="admin-sidebar-panel">
        <p class="admin-sidebar-role" id="admin-role-label"></p>
        <nav class="admin-nav" id="admin-nav"></nav>
        <a class="admin-sidebar-logout" href="index.html" target="_blank" rel="noopener">
          <i data-lucide="store"></i> View store
        </a>
        <button class="admin-sidebar-logout" id="admin-logout" type="button">
          <i data-lucide="log-out"></i> Log out
        </button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1>Reports</h1>
          <p>Sales, stock, and order performance at a glance.</p>
        </div>
      </div>

      <div class="stat-grid" id="stat-grid"></div>

      <div class="section-heading">
        <h2>Low stock</h2>
      </div>
      <div class="data-table-wrap admin-reports-table-spacer">
        <table class="data-table">
          <thead>
            <tr>
              <th>Product</th>
              <th>Category</th>
              <th>Stock</th>
            </tr>
          </thead>
          <tbody id="low-stock-body"></tbody>
        </table>
      </div>

      <div class="section-heading">
        <h2>All orders</h2>
      </div>
      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Order</th>
              <th>Customer</th>
              <th>Date</th>
              <th>Total</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="all-orders-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin-shared.js"></script>
  <script src="../js/admin-reports.js"></script>
</body>

</html>
